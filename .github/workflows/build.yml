name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/endweave/ --strict

      - name: Build wheel
        run: uv build --wheel --out-dir dist/

      - name: Check wheel contents
        run: |
          WHEEL=$(ls dist/*.whl)
          unzip -l "$WHEEL"
          if ! unzip -l "$WHEEL" | grep -q ' endweave/config.toml$'; then
            echo "::error::endweave/config.toml is missing from $WHEEL, the plugin cannot load its defaults at runtime"
            exit 1
          fi
