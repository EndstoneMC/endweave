name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_call:
    inputs:
      ref:
        description: "Ref to build, defaults to the caller's"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/endweave/ --strict

      - name: Check stub
        run: |
          if ! git diff --exit-code src/endweave/_pipeline.pyi; then
            echo "::error::src/endweave/_pipeline.pyi does not match the bindings, commit the regenerated stub"
            exit 1
          fi

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: uv build --sdist --out-dir dist/

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false

  wheels:
    name: Wheel (${{ matrix.python-tag }}-${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-2022 ]
        python-tag: [ "cp310", "cp311", "cp312" ]
        include:
          - os: ubuntu-latest
            platform: manylinux_x86_64
          - os: windows-2022
            platform: win_amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-${{ matrix.platform }}
          CIBW_BUILD_VERBOSITY: 1

      - name: Check wheel contents
        shell: python
        run: |
          import pathlib
          import sys
          import zipfile

          (wheel,) = pathlib.Path("wheelhouse").glob("*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("endweave/config.toml", "endweave/_pipeline.pyi", "endweave/py.typed") if n not in names]
          if not any(n.startswith("endweave/_pipeline.") and n.endswith((".so", ".pyd")) for n in names):
              missing.append("the endweave._pipeline extension")
          if missing:
              print(f"::error::{wheel.name} is missing {', '.join(missing)}")
              sys.exit(1)

      - uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          archive: false

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [ wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-2022 ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: endstone_endweave-*.whl
          path: wheelhouse
          merge-multiple: true
          skip-decompress: true

      - name: Install
        shell: bash
        run: |
          uv export --frozen --no-emit-project --no-hashes --extra dev -o requirements.txt
          uv pip install -r requirements.txt
          uv pip install --no-index --no-deps --find-links wheelhouse endstone-endweave
          uv pip check

      - name: Run tests
        run: python -m pytest tests/
