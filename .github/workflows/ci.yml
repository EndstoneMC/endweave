name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (libstdc++)
            os: ubuntu-24.04
            cxx: g++
          - name: Linux Clang (libstdc++)
            os: ubuntu-24.04
            cxx: clang++-18
            llvm: "18"
          - name: Windows MSVC
            os: windows-2022
            cxx: cl
    steps:
      - name: Checkout endweave
        uses: actions/checkout@v4
        with:
          path: endweave
      # endweave consumes the sibling bedrock-protocol checkout via its default
      # BEDROCK_PROTOCOL_SOURCE_DIR (../bedrock-protocol).
      - name: Checkout bedrock-protocol
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/bedrock-protocol
          ref: develop
          path: bedrock-protocol
      - uses: astral-sh/setup-uv@v5
      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.llvm }}
        if: matrix.llvm
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ENDWEAVE_BUILD_PLUGIN=OFF skips the heavy Endstone SDK fetch; the
      # translation library + Catch2 tests build against only bedrock::protocol.
      # No -stdlib override: each compiler uses its native standard library.
      - name: Configure
        working-directory: endweave
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DENDWEAVE_BUILD_PLUGIN=OFF
      - name: Build
        working-directory: endweave
        run: cmake --build build
      - name: Test
        working-directory: endweave
        run: ctest --test-dir build --output-on-failure
