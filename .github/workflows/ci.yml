name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # Endstone's root CMakeLists hard-errors on anything but Clang (Linux) or clang-cl
  # (Windows), and on a non-Ninja generator -- and it runs those checks before the return()
  # that makes its FetchContent header-only, so they fire here too. These are the only two
  # toolchains an Endstone plugin ships on.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is the glibc floor: a plugin built on a newer image will not load on it.
          - name: Linux clang-18 (libc++)
            os: ubuntu-22.04
            cxx: clang++-18
            llvm: "18"
          - name: Windows clang-cl
            os: windows-2022
            cxx: clang-cl
    steps:
      - name: Checkout endweave
        uses: actions/checkout@v4
        with:
          path: endweave
      # endweave consumes the sibling bedrock-protocol checkout via its default
      # BEDROCK_PROTOCOL_SOURCE_DIR (../bedrock-protocol).
      - name: Checkout bedrock-protocol
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/bedrock-protocol
          ref: main
          path: bedrock-protocol
      - uses: astral-sh/setup-uv@v5
      - uses: lukka/get-cmake@latest

      - name: Install Clang ${{ matrix.llvm }} + libc++
        if: matrix.llvm
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y -q libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        working-directory: endweave
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        working-directory: endweave
        run: cmake --build build

      # The plugin is dlopen'd next to an LD_PRELOADed runtime carrying its own libc++, so
      # anything exported at default visibility can interpose. Expect single digits.
      - name: Check exported symbols
        if: runner.os == 'Linux'
        working-directory: endweave
        run: |
          plugin=$(ls build/endweave-*.so)
          nm -D --defined-only "$plugin"
          test "$(nm -D --defined-only "$plugin" | wc -l)" -lt 20

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            endweave/build/endweave-*.so
            endweave/build/endweave-*.dll
            endweave/build/endweave-*.pdb
          if-no-files-found: error
