[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "endstone-endweave"
dynamic = ["version"]
dependencies = ["aiohttp", "endstone>=0.11", "packaging", "tomlkit"]
description = "Protocol translation plugin for Endstone - allows newer clients on older servers"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin", "protocol", "translation"]
requires-python = ">=3.10"
authors = [{ name = "Vincent", email = "magicdroidx@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[project.urls]
Repository = "https://github.com/EndstoneMC/endweave"
Issues = "https://github.com/EndstoneMC/endweave/issues"

[project.entry-points."endstone"]
endweave = "endweave:EndweavePlugin"

[tool.ruff]
line-length = 120
exclude = ["src/endweave/_version.py", "src/endweave/_pipeline.pyi"]

[tool.ruff.lint]
select = ["I", "E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "endweave.plugin"
disable_error_code = ["assignment", "func-returns-value", "untyped-decorator"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/endweave"]
wheel.py-api = "cp312"
wheel.exclude = ["**/*.cpp", "**/*.h", "**/CMakeLists.txt"]
install.components = ["python"]
sdist.exclude = [".github", "build", "tests"]

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "src/endweave/_version.py"
local_scheme = "no-local-version"