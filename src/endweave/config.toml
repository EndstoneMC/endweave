# Used for updating config files automatically. Do not touch.
config-version = 1

# Check for new versions on startup
check-for-updates = true

# Blocked versions, written as readable version strings with optional '<' and '>' prefixes.
# Blocking works on protocols, not on single versions: an entry names a version, but what it blocks is the protocol
# that version speaks, together with every other version speaking it. The '<' and '>' bounds are exclusive and are
# compared the same way, so ">1.26.30" lets 1.26.31 and 1.26.32 in, because all three speak protocol 1001.
# To block everything on a protocol older than 1.26.0, the protocol 1.26.30 speaks (1.26.30 to 1.26.32),
# and everything on a protocol newer than the one 1.26.40 speaks (so 1.26.41 to 1.26.44 still get in):
#   block-versions = ["<1.26.0", "1.26.30", ">1.26.40"]
# Use block-protocols below when you want to name a protocol outright.
block-versions = []
# Block specific Bedrock protocol version numbers. Can be used alongside block-versions.
block-protocols = []
# Message shown to a player kicked for using a blocked version.
# A '&' in front of a colour or format code is read as the section sign.
block-disconnect-msg = "You are using an unsupported Minecraft version!"

# Logging behaviour. When debugging issues, we may ask you to change some of these.
# Most are off by default so bad input cannot spam the log.
[logging]
# Log more about kicks caused by a blocked protocol version
log-blocked-joins = false
# Log errors while converting entity data
log-entity-data-errors = true
# Warn about other problems while converting items, blocks or anything else between versions
log-other-conversion-warnings = false
# Longest error message written to the console
max-error-length = 1500
