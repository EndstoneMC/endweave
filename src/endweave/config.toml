# Check for new versions on startup
check-for-updates = true

# Blocked versions, written as readable version strings with optional '<' and '>' prefixes.
# Blocking works on protocols, not on single versions: an entry names a version, but what it blocks is the protocol
# that version speaks, together with every other version speaking it. The '<' and '>' bounds are exclusive and are
# compared the same way, so ">26.30" lets 26.31 and 26.32 in, because all three speak protocol 1001.
# To block everything on a protocol older than 26.0, the protocol 26.30 speaks (26.30 to 26.32),
# and everything on a protocol newer than the one 26.40 speaks (so 26.41 to 26.44 still get in):
#   block-versions = ["<26.0", "26.30", ">26.40"]
# Use block-protocols below when you want to name a protocol outright.
block-versions = []
# Block specific Bedrock protocol version numbers. Can be used alongside block-versions.
block-protocols = []
# Message shown to a player kicked for using a blocked version.
# A '&' in front of a colour or format code is read as the section sign.
block-disconnect-msg = "You are using an unsupported Minecraft version!"
# Players whose connection Endweave translates are kicked when it is disabled, as it is on a reload,
# since their connection would no longer be translated. (We don't suggest using reload, restart the server instead.)
# Message they are kicked with. A '&' in front of a colour or format code is read as the section sign.
reload-disconnect-msg = "Server reload, please rejoin!"

# Logging behaviour. When debugging issues, we may ask you to change some of these.
# Most are off by default so bad input cannot spam the log.
[logging]
# Log more about kicks caused by a blocked protocol version
log-blocked-joins = false
# Warn when a packet is dropped because a transform cannot carry it to the version on the other side.
# This covers the packets Endweave gives up on quietly; a translation that fails outright is always
# reported, and the player is kicked, whatever this is set to.
log-other-conversion-warnings = false
# Longest error message written to the console, 0 to keep the whole thing
max-error-length = 1500
